<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bedtime Chapter</title><meta name="theme-color" content="#112e42"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>:root{--bg:#fffaf0;--ink:#1f2a36;--muted:#5d6b78;--line:#e8dcc4;--ask:#eef6ff;--slip:#fff1e6;--accent:#b4531a;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1f;--ink:#ece6da;--muted:#a9b1ba;--line:#343a44;--ask:#1c2a3a;--slip:#3a2618;--accent:#f0a36a;--card:#20242b}}
:root[data-theme="dark"]{--bg:#171a1f;--ink:#ece6da;--muted:#a9b1ba;--line:#343a44;--ask:#1c2a3a;--slip:#3a2618;--accent:#f0a36a;--card:#20242b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 Georgia,'Iowan Old Style',serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:760px;margin:0 auto;padding:16px;font-family:system-ui,sans-serif;font-size:15px}
header a,header button{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-decoration:none;font:inherit;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:0 16px 64px}article{border-top:2px solid var(--line);padding-top:18px;margin-top:18px}
h1{font-size:1.8rem;line-height:1.2;margin:.1em 0 .4em}.kicker{color:var(--accent);font:700 .78rem/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.scene{font-size:1.3em}aside{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:14px 0;font-family:system-ui,sans-serif;font-size:.95rem}aside b{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}aside p{margin:.3em 0}.ask{background:var(--ask)}.slip{background:var(--slip)}.q{color:var(--muted)}
.did{font-family:system-ui,sans-serif;font-size:.95rem;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.did li{margin:.15em 0}.bedtime{font-style:italic}.empty{color:var(--muted);font-family:system-ui,sans-serif}
@media print{header{display:none}body{background:#fff;color:#000;font-size:14pt}article{break-before:page;border:0}article:first-child{break-before:auto}aside,.did{background:none!important;break-inside:avoid}}</style></head>
<body><header><a href="/">← Games</a><span id="day"></span><span><button id="prev" type="button">‹ Day</button> <button id="next" type="button">Day ›</button> <button id="print" type="button">Print</button></span></header><main id="main"><p class="empty">Loading…</p></main><script type="module" src="/bedtime.mjs"></script></body></html>
