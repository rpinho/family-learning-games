<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Family Learning Games</title><meta name="description" content="Choose a game: words, numbers, mazes, chess, strategy and soccer."><meta name="theme-color" content="#112e42"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/chess/style.css"></head><body><header class="top"><button id="home" class="home" aria-label="Back to all games"><img src="/icon.svg" alt=""> <span>Games</span></button><div class="identity"><small>PLAYING AS</small><strong id="player-name">Family Learning Games</strong></div><button id="refresh">↻ <span>Refresh</span></button></header><main id="main"></main><dialog id="parents"><form id="gate-form"><h2>Grown-ups</h2><p id="gate-question"></p><p id="gate-code" class="gate-code"></p><label>Answer <input id="gate-answer" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" required></label><p id="gate-error" role="status"></p><div class="dialog-actions"><button id="gate-cancel" type="button">Cancel</button><button id="unlock" type="submit">Continue</button></div></form><section id="parent-options" hidden><h2>Grown-ups</h2><label class="menu-style-label">Game pictures <select id="menu-style"><option value="screenshots">Gameplay screenshots</option><option value="logos">Illustrated logos</option></select></label><p class="menu-option-note">For this player on this device.</p><button id="change-player" type="button">Change player</button><div class="dialog-actions"><button id="parent-done" type="button">Done</button></div></section></dialog><script type="module" src="/hub.mjs"></script></body></html>
