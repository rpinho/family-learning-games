name: Public secrets gate
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanners
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          docker pull trufflesecurity/trufflehog:3.97.9
          cat > /tmp/trufflehog <<'SH'
          #!/bin/sh
          exec docker run --rm --network=none -v /tmp:/tmp -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" trufflesecurity/trufflehog:3.97.9 "$@"
          SH
          sudo install -m 755 /tmp/trufflehog /usr/local/bin/trufflehog
      - name: Scan PR or push range plus filesystem
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            node scripts/check-public-tree.mjs --secrets-only --all-history
            exit $?
          fi
          node scripts/check-public-tree.mjs --secrets-only --base "$base"
